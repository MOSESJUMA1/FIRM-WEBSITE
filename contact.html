<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Consultation | Apex Legal Advocates</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: linear-gradient(135deg, #1a3a52 0%, #0d1f2d 100%); color: #fff; min-height: 100vh; }

        header { background: #fff; padding: 20px 40px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        nav { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto; }
        .logo { font-size: 24px; font-weight: bold; color: #1a3a52; }
        .nav-links { display: flex; gap: 30px; list-style: none; }
        .nav-links a { text-decoration: none; color: #333; font-weight: 500; transition: color 0.3s; }
        .nav-links a:hover { color: #c9a961; }
        .book-btn { background: #c9a961; color: #fff; padding: 10px 20px; border-radius: 4px; text-decoration: none; font-weight: bold; }
        .book-btn:hover { background: #b8956f; }

        .container { max-width: 600px; margin: 60px auto; padding: 40px; background: rgba(255,255,255,0.95); border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); color: #333; }

        .form-header { text-align: center; margin-bottom: 30px; }
        .form-header h1 { color: #1a3a52; margin-bottom: 10px; font-size: 32px; }
        .form-header p { color: #666; font-size: 16px; }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #1a3a52; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; font-family: inherit; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: #c9a961; box-shadow: 0 0 5px rgba(201, 169, 97, 0.3); }

        .submit-btn { width: 100%; padding: 14px; background: #c9a961; color: #fff; border: none; border-radius: 4px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.3s; }
        .submit-btn:hover { background: #b8956f; }
        .submit-btn:disabled { background: #ccc; cursor: not-allowed; }

        .alert { padding: 15px; border-radius: 4px; margin-bottom: 20px; display: none; font-weight: 600; }
        .alert.success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert.error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

        footer { background: #0d1f2d; text-align: center; padding: 20px; color: #999; margin-top: 60px; font-size: 14px; }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo">Apex Legal</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="index.html#services">Practice Areas</a></li>
                <li><a href="team.html">Our Team</a></li>
                <li><a href="contact.html" class="book-btn">Book Consultation</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <div class="form-header">
            <h1>Book a Consultation</h1>
            <p>Get expert legal counsel from our trusted advocates</p>
        </div>

        <div id="alert" class="alert"></div>

        <form id="consultationForm">
            <div class="form-group">
                <label for="clientName">Full Name *</label>
                <input type="text" id="clientName" required placeholder="John Doe">
            </div>

            <div class="form-group">
                <label for="clientEmail">Email Address *</label>
                <input type="email" id="clientEmail" required placeholder="john@example.com">
            </div>

            <div class="form-group">
                <label for="mpesaPhone">Mobile Number *</label>
                <input type="tel" id="mpesaPhone" placeholder="e.g. 0712345678" required>
            </div>

            <div class="form-group">
                <label for="practiceArea">Service Area *</label>
                <select id="practiceArea" required>
                    <option value="">Select a service area</option>
                    <option value="Corporate Law">Corporate Law</option>
                    <option value="Conveyancing">Conveyancing</option>
                    <option value="Dispute Resolution">Dispute Resolution</option>
                    <option value="Employment Law">Employment Law</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <button type="submit" id="submitBtn" class="submit-btn">
                <i class="fas fa-paper-plane"></i> Submit Consultation Request
            </button>
        </form>
    </div>

    <footer>
        <p>&copy; 2026 Apex Legal Advocates. All rights reserved.</p>
    </footer>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>
    // FIXED: Correct Supabase Anon Key
    const supabaseUrl = 'https://hjbrllpbpajzmgpgkadf.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhqYnJsbHBicGFqem1ncGdrYWRmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2OTYxOTIsImV4cCI6MjEwMjI3MjE5Mn0.MeUv7ugRF0QMXamvgVdJ0oFvpdnxBAgH3efi8Hnszv4';
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

    document.getElementById('consultationForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const clientName = document.getElementById('clientName').value.trim();
        const clientEmail = document.getElementById('clientEmail').value.trim();
        const clientPhone = document.getElementById('mpesaPhone').value.trim();
        const serviceArea = document.getElementById('practiceArea').value;

        // Format phone to 254...
        let formattedPhone = clientPhone;
        if (clientPhone.startsWith('0')) {
            formattedPhone = '254' + clientPhone.substring(1);
        } else if (clientPhone.startsWith('+')) {
            formattedPhone = clientPhone.substring(1);
        }

        // FIXED: Secure token using crypto.getRandomValues
        const bytes = new Uint8Array(12);
        crypto.getRandomValues(bytes);
        const token = 'alx-' + Array.from(bytes).map(b => b.toString(36)).join('').toUpperCase();

        const submitBtn = document.getElementById('submitBtn');
        const alert = document.getElementById('alert');

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Submitting...';

        try {
            const { error } = await supabaseClient.from('bookings').insert([{
                full_name: clientName,
                email: clientEmail,
                phone: formattedPhone,
                service_requested: serviceArea,
                token: token,
                payment_status: 'Pending'
            }]);

            if (error) throw error;

            // Send email via Formspree
            const clientLink = window.location.origin + '/client-case.html?token=' + token;
            const emailData = new FormData();
            emailData.append('email', clientEmail);
            emailData.append('message', `Hi ${clientName},

Your consultation request has been received!

View your case profile:
${clientLink}

Thank you,
Apex Legal Advocates`);

            fetch('https://formspree.io/f/xdaqwnyb', {
                method: 'POST',
                body: emailData
            }).catch(() => {});

            alert.className = 'alert success';
            alert.innerHTML = `✅ Success! Check <strong>${clientEmail}</strong> for your case profile link.`;
            alert.style.display = 'block';
            document.getElementById('consultationForm').reset();
            submitBtn.innerHTML = '<i class="fas fa-check"></i> Submitted';

        } catch (error) {
            alert.className = 'alert error';
            alert.textContent = '❌ Error: ' + (error.message || 'Something went wrong. Please try again.');
            alert.style.display = 'block';
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Submit Consultation Request';
        }
    });
</script>
</body>
</html>
