<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login | Apex Legal Advocates</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        .role-selector { display: flex; gap: 12px; margin-bottom: 24px; justify-content: center; }
        .role-pill {
            padding: 10px 24px; border: 2px solid var(--olive); border-radius: 50px;
            cursor: pointer; font-weight: 700; font-size: 0.85rem; transition: all 0.2s;
            background: white; color: var(--navy);
        }
        .role-pill.active { background: var(--navy); color: white; border-color: var(--navy); }
        .role-pill:hover:not(.active) { border-color: var(--gold); }
        .back-home { text-align: center; margin-top: 20px; }
        .back-home a { color: var(--navy); text-decoration: none; font-weight: 600; font-size: 0.9rem; }
    </style>
</head>
<body class="auth-page">

<div class="auth-card">
    <div style="text-align:center; margin-bottom:24px;">
        <h2 style="color:var(--navy); font-size:1.5rem;"><i class="fas fa-gavel" style="color:var(--gold);"></i> Apex Legal</h2>
        <p style="color:#64748b; font-size:0.85rem; margin-top:4px;">Staff & Admin Portal</p>
    </div>

    <div class="role-selector">
        <div class="role-pill active" onclick="setRole('advocate', this)">Advocate</div>
        <div class="role-pill" onclick="setRole('admin', this)">Administrator</div>
    </div>

    <div id="loginAlert" class="alert"></div>

    <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="loginEmail" required placeholder="you@apexlegal.co.ke">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="loginPassword" required placeholder="••••••••">
        </div>
        <button type="submit" class="navy-btn" id="loginBtn">
            <i class="fas fa-sign-in-alt"></i> Login
        </button>
    </form>

    <div class="back-home">
        <a href="index.html"><i class="fas fa-arrow-left"></i> Back to Website</a>
    </div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
<script>
    let currentRole = 'advocate';

    function setRole(role, el) {
        currentRole = role;
        document.querySelectorAll('.role-pill').forEach(p => p.classList.remove('active'));
        el.classList.add('active');
        document.getElementById('loginEmail').placeholder = role === 'admin' ? 'admin@apexlegal.co.ke' : 'you@apexlegal.co.ke';
    }

    function showAlert(msg, isError) {
        const el = document.getElementById('loginAlert');
        el.textContent = msg;
        el.className = 'alert ' + (isError ? 'error' : 'success');
        el.style.display = 'block';
    }

    async function handleLogin(e) {
        e.preventDefault();
        const btn = document.getElementById('loginBtn');
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;

        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Logging in...';

        try {
            let result;
            if (currentRole === 'admin') {
                result = await ApexAuth.loginAdmin(email, password);
            } else {
                result = await ApexAuth.loginAdvocate(email, password);
            }

            showAlert('Login successful! Redirecting...', false);

            setTimeout(() => {
                // FIXED: admin-dashboard.html instead of admin.html
                if (result.role === 'admin') window.location.href = 'admin-dashboard.html';
                else window.location.href = 'staff-dashboard.html';
            }, 800);

        } catch (err) {
            showAlert(err.message || 'Login failed', true);
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
        }
    }
</script>
</body>
</html>
