<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Staff Login | Apex Legal Advocates</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">


<link rel="stylesheet" href="home.css">


<style>

.auth-page{

min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:#f8f9fa;

}


.auth-card{

background:white;
width:100%;
max-width:420px;
padding:40px;
border-radius:10px;
box-shadow:0 15px 40px rgba(0,0,0,.12);

}


.auth-card h2{

color:#0c1e36;
text-align:center;

}


.form-group{

margin-bottom:20px;

}


.form-group label{

display:block;
font-weight:600;
margin-bottom:6px;

}


.form-group input{

width:100%;
padding:14px;
border:1px solid #ddd;
border-radius:6px;

}



.navy-btn{

width:100%;
padding:14px;
background:#0c1e36;
color:white;
border:none;
border-radius:6px;
font-weight:bold;
cursor:pointer;

}



.navy-btn:hover{

background:#c5a059;

}



.alert{

display:none;
padding:12px;
margin-bottom:15px;
border-radius:6px;

}


.alert.success{

background:#dcfce7;
color:#166534;

}


.alert.error{

background:#fee2e2;
color:#991b1b;

}


.back-home{

text-align:center;
margin-top:20px;

}


.back-home a{

color:#0c1e36;
text-decoration:none;

}


</style>

</head>



<body class="auth-page">


<div class="auth-card">


<h2>
<i class="fa-solid fa-scale-balanced"></i>
Apex Legal
</h2>


<p style="text-align:center;color:#666;margin-bottom:30px;">
Staff Portal
</p>



<div id="loginAlert" class="alert"></div>



<form onsubmit="handleLogin(event)">


<div class="form-group">

<label>Email Address</label>

<input 
type="email"
id="email"
placeholder="staff@apexlegal.co.ke"
required>

</div>



<div class="form-group">

<label>Password</label>

<input
type="password"
id="password"
placeholder="Password"
required>

</div>




<button class="navy-btn" id="loginBtn">

<i class="fa-solid fa-right-to-bracket"></i>
Login

</button>


</form>



<div class="back-home">

<a href="index.html">
<i class="fa-solid fa-arrow-left"></i>
Back to Website
</a>

</div>


</div>





<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<script src="auth.js"></script>
<script>

function showAlert(message,error=false){

const box=document.getElementById("loginAlert");

box.textContent=message;

box.className =
"alert "+(error?"error":"success");

box.style.display="block";

}





async function handleLogin(e){

e.preventDefault();


const btn=document.getElementById("loginBtn");

btn.disabled=true;

btn.innerHTML="Logging in...";



const email =
document.getElementById("email")
.value.trim()
.toLowerCase();



const password =
document.getElementById("password")
.value;



try{


let result;


try{

result =
await ApexAuth.loginAdmin(
email,
password
);


}

catch{

result =
await ApexAuth.loginAdvocate(
email,
password
);

}




showAlert(
"Login successful"
);



setTimeout(()=>{


if(result.role==="admin"){

window.location.href=
"admin-dashboard.html";

}

else{

window.location.href=
"advocate-dashboard.html";

}


},800);



}

catch(err){


showAlert(
err.message,
true
);


btn.disabled=false;

btn.innerHTML="Login";


}


}


</script>


</body>


</html>
