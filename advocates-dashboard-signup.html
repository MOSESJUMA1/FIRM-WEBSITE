<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Advocates Dashboard | Apex Legal</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Segoe UI", Arial, sans-serif;
        background: #e6ebdd; /* light olive tint background */
        color: #0a1c3a; /* dark navy text */
      }

      /* Auth Styles */
      .auth-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: linear-gradient(
          135deg,
          #001f4d 0%,
          #0a1c3a 60%,
          #0c233c 100%
        );
        padding: 20px;
      }
      .auth-box {
        background: white;
        padding: 40px 30px;
        border-radius: 30px 30px 60px 60px / 60px 40px 60px 40px;
        box-shadow: 0 15px 40px rgba(0, 0, 40, 0.15);
        width: 100%;
        max-width: 480px;
        border: 3px solid #a5b37a;
        animation: slideUp 0.4s ease;
      }
      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .auth-header {
        text-align: center;
        margin-bottom: 30px;
      }
      .auth-header h1 {
        color: #001f4d;
        margin-bottom: 10px;
        font-size: 26px;
      }
      .auth-header p {
        color: #506039;
        font-size: 14px;
      }
      .tabs {
        display: flex;
        gap: 10px;
        margin-bottom: 30px;
        border-bottom: 3px solid #a5b37a;
      }
      .tab-btn {
        flex: 1;
        padding: 12px;
        background: none;
        border: none;
        color: #4d5a34;
        font-weight: 700;
        cursor: pointer;
        border-bottom: 5px solid transparent;
        transition: all 0.3s;
        font-size: 14px;
        border-radius: 10px 10px 0 0;
      }
      .tab-btn.active {
        color: #001f4d;
        border-bottom-color: #a5b37a;
      }
      .form-section {
        display: none;
      }
      .form-section.active {
        display: block;
      }
      .form-group {
        margin-bottom: 18px;
      }
      .form-group label {
        display: block;
        color: #0a1c3a;
        font-weight: 600;
        margin-bottom: 6px;
        font-size: 13px;
      }
      .form-group input,
      .form-group select {
        width: 100%;
        padding: 12px;
        border: 2px solid #a5b37a;
        border-radius: 14px;
        font-size: 14px;
        transition: border-color 0.2s, box-shadow 0.2s;
      }
      .form-group input:focus,
      .form-group select:focus {
        outline: none;
        border-color: #001f4d;
        box-shadow: 0 0 8px rgba(0, 31, 77, 0.5);
      }
      .submit-btn {
        width: 100%;
        padding: 12px;
        background: #0a1c3a;
        color: #c9d186;
        border: 2px solid #a0b56f;
        border-radius: 25px;
        font-weight: 600;
        cursor: pointer;
        font-size: 14px;
        margin-top: 10px;
        transition: background-color 0.3s, box-shadow 0.3s;
        position: relative;
      }
      .submit-btn:hover:not(:disabled) {
        background: #a5b37a;
        color: #001f4d;
        box-shadow: 0 5px 15px rgba(165, 179, 122, 0.6);
        transform: translateY(-2px);
      }
      .submit-btn:disabled {
        background: #ccc;
        cursor: not-allowed;
      }
      .submit-btn .spinner {
        display: none;
        margin-right: 8px;
      }
      .submit-btn.loading .spinner {
        display: inline-block;
      }
      .message {
        padding: 12px 16px;
        border-radius: 6px;
        margin-bottom: 20px;
        font-size: 13px;
        display: none;
        animation: slideDown 0.3s ease;
      }
      @keyframes slideDown {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .error-message {
        background: #fee;
        border-left: 4px solid #f44;
        color: #c33;
      }
      .success-message {
        background: #efe;
        border-left: 4px solid #4c4;
        color: #3a3;
      }

      /* Dashboard Styles */
      .dashboard {
        display: none;
        min-height: 100vh;
      }
      .header {
        background: #001f4d;
        color: #d2dda9;
        padding: 16px 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: sticky;
        top: 0;
        z-index: 100;
        box-shadow: 0 4px 15px rgba(0, 0, 30, 0.2);
        border-radius: 0 0 40px 40px;
      }
      .header h1 {
        font-size: 22px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .header-actions {
        display: flex;
        align-items: center;
        gap: 20px;
      }
      .logout-btn {
        background: #a5b37a;
        color: #001f4d;
        border: none;
        padding: 8px 18px;
        border-radius: 25px;
        cursor: pointer;
        font-weight: 600;
        transition: all 0.3s;
      }
      .logout-btn:hover {
        background: #88964f;
        transform: translateY(-2px);
      }
      .container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 25px 30px;
        background: white;
        border-radius: 30px 30px 60px 60px / 60px 40px 60px 40px;
        box-shadow: 0 15px 40px rgba(0, 0, 40, 0.15);
        border: 3px solid #a5b37a;
      }

      /* Stats Bar */
      .stats-bar {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
        margin-bottom: 25px;
      }
      .stat-box {
        background: #f0f4de;
        padding: 20px;
        border-radius: 25px;
        box-shadow: 0 4px 10px rgba(165, 179, 122, 0.2);
        display: flex;
        align-items: center;
        gap: 15px;
        transition: transform 0.3s;
        border: 2px solid #a5b37a;
      }
      .stat-box:hover {
        transform: translateY(-3px);
      }
      .stat-icon {
        width: 50px;
        height: 50px;
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        background: #a5b37a;
        color: #001f4d;
      }
      .stat-info h4 {
        font-size: 12px;
        color: #506039;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 4px;
      }
      .stat-info .stat-num {
        font-size: 28px;
        font-weight: 700;
        color: #001f4d;
      }

      /* Filters */
      .filters {
        background: white;
        padding: 20px;
        border-radius: 25px;
        margin-bottom: 25px;
        box-shadow: 0 4px 12px rgba(165, 179, 122, 0.15);
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        align-items: center;
        border: 2px solid #a5b37a;
      }
      .filter-input {
        padding: 10px 14px;
        border: 2px solid #d4d9a9;
        border-radius: 15px;
        font-size: 13px;
        min-width: 160px;
        transition: all 0.3s;
        color: #0a1c3a;
      }
      .filter-input:focus {
        outline: none;
        border-color: #001f4d;
        box-shadow: 0 0 10px rgba(0, 31, 77, 0.4);
      }
      .filter-toggle {
        display: flex;
        background: #f5f6df;
        border-radius: 15px;
        padding: 4px;
        gap: 4px;
      }
      .filter-toggle button {
        padding: 8px 16px;
        border: none;
        background: transparent;
        border-radius: 15px;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        color: #4d5a34;
        transition: all 0.3s;
      }
      .filter-toggle button.active {
        background: #a5b37a;
        color: #001f4d;
        box-shadow: 0 1px 6px rgba(0, 0, 0, 0.1);
        font-weight: 800;
      }
      .reset-btn {
        background: #f5f5f5;
        border: none;
        padding: 10px 16px;
        border-radius: 15px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
        color: #506039;
        transition: all 0.3s;
        border: 2px solid #a5b37a;
      }
      .reset-btn:hover {
        background: #e0e8af;
      }

      /* Clients Grid */
      .clients-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
        gap: 20px;
      }
      .client-card {
        background: white;
        border-radius: 24px 12px 24px 12px / 40% 60% 40% 60%;
        box-shadow: 0 8px 20px rgba(0, 0, 20, 0.05);
        overflow: hidden;
        transition: box-shadow 0.3s ease, transform 0.3s ease;
        border: 2px solid #a5b37a;
        position: relative;
      }
      .client-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 12px 30px rgba(0, 0, 40, 0.15);
        border-color: #88964f;
      }
      .client-card.urgent {
        border-left: 6px solid #7a2424;
      }
      .client-card-header {
        background: linear-gradient(135deg, #001f4d 0%, #2c3a82 100%);
        color: #d2dda9;
        padding: 18px;
        position: relative;
      }
      .client-card-header .priority-badge {
        position: absolute;
        top: 12px;
        right: 12px;
        padding: 5px 14px;
        border-radius: 20px;
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        user-select: none;
      }
      .priority-high {
        background-color: #7a9246;
        color: #e8f0c6;
      }
      .priority-medium {
        background-color: #a5b37a;
        color: #f3f6dd;
      }
      .priority-low {
        background-color: #ccd3af;
        color: #555f22;
      }
      .client-name {
        font-size: 18px;
        font-weight: 700;
        margin-bottom: 6px;
        padding-right: 70px;
      }
      .client-service {
        font-size: 12px;
        opacity: 0.85;
        font-weight: 500;
      }
      .client-card-body {
        padding: 18px;
      }
      .client-meta {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-bottom: 14px;
      }
      .client-info {
        font-size: 13px;
      }
      .client-info-label {
        color: #506039;
        font-weight: 600;
        text-transform: uppercase;
        font-size: 10px;
        margin-bottom: 3px;
        letter-spacing: 0.5px;
      }
      .client-info-value {
        color: #0a1c3a;
        font-weight: 500;
      }
      .client-info-value a {
        color: #2c5282;
        text-decoration: none;
      }
      .client-info-value a:hover {
        text-decoration: underline;
      }
      .deadline-info {
        background: #fff8e1;
        border-radius: 15px;
        padding: 8px 12px;
        margin-bottom: 14px;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: #a09145;
        font-weight: 600;
      }
      .deadline-info.overdue {
        background: #ffebee;
        color: #7a2424;
      }
      .status-badge {
        display: inline-block;
        padding: 6px 16px;
        border-radius: 20px;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .status-pending {
        background: #d9d9b8;
        color: #506039;
      }
      .status-assigned {
        background: #c6d8d3;
        color: #2b4a46;
      }
      .status-inprogress {
        background: #ccc9df;
        color: #393056;
      }
      .status-completed {
        background: #d9e8db;
        color: #334d25;
      }

      .client-actions {
        display: flex;
        gap: 8px;
        margin-top: 14px;
        padding-top: 14px;
        border-top: 1px solid #f0f0f0;
      }
      .btn-small {
        flex: 1;
        padding: 9px;
        border: none;
        border-radius: 25px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }
      .btn-small:hover {
        transform: translateY(-2px);
      }
      .btn-view {
        background: #a5b37a;
        color: #001f4d;
      }
      .btn-view:hover {
        background: #88964f;
      }
      .btn-update {
        background: #fff8e1;
        color: #a09145;
      }
      .btn-update:hover {
        background: #f4eda3;
      }
      .btn-message {
        background: #d9e8db;
        color: #436829;
      }
      .btn-message:hover {
        background: #b0c69c;
      }

      /* Empty & Loading States */
      .empty-state {
        text-align: center;
        padding: 80px 20px;
        color: #88964f;
        grid-column: 1 / -1;
      }
      .empty-state i {
        font-size: 56px;
        margin-bottom: 20px;
        opacity: 0.4;
        color: #001f4d;
      }
      .empty-state h3 {
        color: #4d5a34;
        margin-bottom: 8px;
        font-size: 20px;
      }
      .loading {
        text-align: center;
        padding: 60px;
        color: #506039;
        grid-column: 1 / -1;
      }

      /* Modals */
      .modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        justify-content: center;
        align-items: center;
        z-index: 1000;
        padding: 20px;
        backdrop-filter: blur(4px);
      }
      .modal.active {
        display: flex;
        animation: fadeIn 0.2s ease;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      .modal-content {
        background: white;
        padding: 0;
        border-radius: 30px 30px 60px 60px / 60px 40px 60px 40px;
        width: 100%;
        max-width: 600px;
        max-height: 90vh;
        overflow-y: auto;
        box-shadow: 0 15px 40px rgba(0, 0, 40, 0.3);
        border: 3px solid #a5b37a;
        animation: scaleIn 0.3s ease;
      }
      @keyframes scaleIn {
        from {
          opacity: 0;
          transform: scale(0.95);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 24px;
        border-bottom: 1px solid #eee;
        background: #f4f6df;
        border-radius: 30px 30px 0 0 / 60px 40px 0 0;
        color: #001f4d;
        font-weight: 700;
      }
      .modal-header h2 {
        font-size: 18px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .close-btn {
        background: none;
        border: none;
        font-size: 28px;
        cursor: pointer;
        color: #506039;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s;
      }
      .close-btn:hover {
        background: #a5b37a;
        color: #001f4d;
      }
      .modal-body {
        padding: 24px;
        color: #0a1c3a;
      }
      .form-group-modal {
        margin-bottom: 18px;
      }
      .form-group-modal label {
        display: block;
        color: #0a1c3a;
        font-weight: 600;
        margin-bottom: 6px;
        font-size: 13px;
      }
      .form-group-modal input,
      .form-group-modal select,
      .form-group-modal textarea {
        width: 100%;
        padding: 10px 12px;
        border: 2px solid #a5b37a;
        border-radius: 15px;
        font-size: 14px;
        font-family: inherit;
        transition: all 0.3s;
        color: #0a1c3a;
      }
      .form-group-modal input:focus,
      .form-group-modal select:focus,
      .form-group-modal textarea:focus {
        outline: none;
        border-color: #001f4d;
        box-shadow: 0 0 10px rgba(0, 31, 77, 0.5);
      }
      .form-group-modal textarea {
        resize: vertical;
        min-height: 100px;
      }
      .checkbox-wrap {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px;
        background: #f8f9fa;
        border-radius: 15px;
        cursor: pointer;
      }
      .checkbox-wrap input[type="checkbox"] {
        width: 18px;
        height: 18px;
        accent-color: #001f4d;
      }
      .checkbox-wrap span {
        font-size: 14px;
        font-weight: 500;
        color: #0a1c3a;
      }
      .modal-actions {
        display: flex;
        gap: 10px;
        padding: 20px 24px;
        border-top: 1px solid #eee;
        background: #f4f6df;
        border-radius: 0 0 30px 30px / 0 0 60px 60px;
      }
      .modal-actions button {
        flex: 1;
        padding: 12px;
        border: none;
        border-radius: 25px;
        font-weight: 700;
        cursor: pointer;
        font-size: 14px;
        transition: all 0.3s;
      }
      .btn-save {
        background: #0a1c3a;
        color: #c9d186;
      }
      .btn-save:hover {
        background: #a5b37a;
        color: #001f4d;
        transform: translateY(-2px);
      }
      .btn-cancel {
        background: #d9d9b8;
        color: #506039;
      }
      .btn-cancel:hover {
        background: #b0c69c;
      }

      /* Timeline */
      .timeline {
        position: relative;
        padding-left: 24px;
        margin: 15px 0;
      }
      .timeline::before {
        content: "";
        position: absolute;
        left: 7px;
        top: 0;
        bottom: 0;
        width: 2px;
        background: #a5b37a;
      }
      .timeline-item {
        position: relative;
        margin-bottom: 16px;
        padding-bottom: 16px;
        border-bottom: 1px solid #f5f5f5;
      }
      .timeline-item:last-child {
        border-bottom: none;
        margin-bottom: 0;
        padding-bottom: 0;
      }
      .timeline-dot {
        position: absolute;
        left: -20px;
        top: 4px;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #a5b37a;
        border: 2px solid white;
        box-shadow: 0 0 0 2px #a5b37a;
      }
      .timeline-time {
        font-size: 11px;
        color: #506039;
        margin-bottom: 4px;
      }
      .timeline-text {
        font-size: 13px;
        color: #0a1c3a;
        line-height: 1.5;
      }

      /* Toast */
      .toast-container {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 2000;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .toast {
        padding: 14px 20px;
        border-radius: 20px;
        color: white;
        font-weight: 500;
        font-size: 14px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
        animation: slideInRight 0.3s ease;
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 280px;
      }
      @keyframes slideInRight {
        from {
          opacity: 0;
          transform: translateX(100%);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }
      .toast.success {
        background: #7a9246;
      }
      .toast.error {
        background: #7a2424;
      }
      .toast.info {
        background: #0a1c3a;
      }

      /* Responsive */
      @media (max-width: 768px) {
        .header {
          padding: 12px 16px;
          flex-wrap: wrap;
          gap: 10px;
        }
        .header h1 {
          font-size: 18px;
        }
        .container {
          padding: 15px 20px;
          border-radius: 20px;
        }
        .auth-box {
          border-radius: 20px;
          padding: 30px 20px;
          max-width: 400px;
        }
        .clients-grid {
          grid-template-columns: 1fr;
        }
        .client-meta {
          grid-template-columns: 1fr;
        }
        .stats-bar {
          grid-template-columns: repeat(2, 1fr);
        }
        .filters {
          flex-direction: column;
          align-items: stretch;
        }
        .filter-toggle {
          width: 100%;
          justify-content: center;
        }
      }
    </style>
  </head>
  <body>
    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- Auth Section -->
    <div id="authSection" class="auth-container">
      <div class="auth-box">
        <div class="auth-header">
          <h1><i class="fas fa-gavel"></i> Advocate Portal</h1>
          <p>Apex Legal Case Management</p>
        </div>

        <div class="tabs">
          <button class="tab-btn active" onclick="switchTab('login', this)">Login</button>
          <button class="tab-btn" onclick="switchTab('signup', this)">Create Account</button>
        </div>

        <!-- Login Form -->
        <div id="login" class="form-section active">
          <div id="loginMessage" class="message"></div>
          <form onsubmit="handleLogin(event)">
            <div class="form-group">
              <label>Email Address</label>
              <input type="email" id="loginEmail" required placeholder="your@email.com" />
            </div>
            <div class="form-group">
              <label>Password</label>
              <input type="password" id="loginPassword" required placeholder="••••••••" />
            </div>
            <button type="submit" class="submit-btn" id="loginBtn">
              <i class="fas fa-spinner fa-spin spinner"></i>
              <span>Login</span>
            </button>
          </form>
        </div>

        <!-- Signup Form -->
        <div id="signup" class="form-section">
          <div id="signupMessage" class="message"></div>
          <form onsubmit="handleSignup(event)">
            <div class="form-group">
              <label>Full Name</label>
              <input type="text" id="signupName" required placeholder="Your Name" />
            </div>
            <div class="form-group">
              <label>Email Address</label>
              <input type="email" id="signupEmail" required placeholder="your@email.com" />
            </div>
            <div class="form-group">
              <label>Phone Number</label>
              <input type="tel" id="signupPhone" placeholder="+1 (555) 000-0000" />
            </div>
            <div class="form-group">
              <label>Specialization</label>
              <select id="signupSpecialization">
                <option value="General Practice">General Practice</option>
                <option value="Corporate Law">Corporate Law</option>
                <option value="Conveyancing">Conveyancing</option>
                <option value="Dispute Resolution">Dispute Resolution</option>
                <option value="Family Law">Family Law</option>
                <option value="Criminal Law">Criminal Law</option>
              </select>
            </div>
            <div class="form-group">
              <label>Password</label>
              <input
                type="password"
                id="signupPassword"
                required
                placeholder="At least 6 characters"
              />
            </div>
            <div class="form-group">
              <label>Confirm Password</label>
              <input type="password" id="signupPasswordConfirm" required placeholder="••••••••" />
            </div>
            <button type="submit" class="submit-btn" id="signupBtn">
              <i class="fas fa-spinner fa-spin spinner"></i>
              <span>Create Account</span>
            </button>
          </form>
        </div>
      </div>
    </div>

    <!-- Dashboard Section -->
    <div id="dashboard" class="dashboard">
      <div class="header">
        <h1><i class="fas fa-briefcase"></i> Advocates Dashboard</h1>
        <div class="header-actions">
          <span>Welcome, <strong id="advocateName">Advocate</strong></span>
          <button class="logout-btn" onclick="handleLogout()">
            <i class="fas fa-sign-out-alt"></i> Logout
          </button>
        </div>
      </div>

      <div class="container">
        <!-- Stats -->
        <div class="stats-bar">
          <div class="stat-box">
            <div class="stat-icon blue"><i class="fas fa-briefcase"></i></div>
            <div class="stat-info">
              <h4>Total Cases</h4>
              <div class="stat-num" id="statTotal">0</div>
            </div>
          </div>
          <div class="stat-box">
            <div class="stat-icon orange"><i class="fas fa-clock"></i></div>
            <div class="stat-info">
              <h4>Pending</h4>
              <div class="stat-num" id="statPending">0</div>
            </div>
          </div>
          <div class="stat-box">
            <div class="stat-icon purple"><i class="fas fa-user-check"></i></div>
            <div class="stat-info">
              <h4>My Cases</h4>
              <div class="stat-num" id="statMine">0</div>
            </div>
          </div>
          <div class="stat-box">
            <div class="stat-icon green"><i class="fas fa-check-circle"></i></div>
            <div class="stat-info">
              <h4>Completed</h4>
              <div class="stat-num" id="statCompleted">0</div>
            </div>
          </div>
        </div>

        <!-- Filters -->
        <div class="filters">
          <input
            type="text"
            id="searchInput"
            class="filter-input"
            placeholder="Search clients, emails, services..."
          />
          <select id="statusFilter" class="filter-input">
            <option value="">All Status</option>
            <option value="Pending">Pending</option>
            <option value="Assigned">Assigned</option>
            <option value="In Progress">In Progress</option>
            <option value="Completed">Completed</option>
          </select>
          <select id="priorityFilter" class="filter-input">
            <option value="">All Priorities</option>
            <option value="High">High Priority</option>
            <option value="Medium">Medium Priority</option>
            <option value="Low">Low Priority</option>
          </select>
          <div class="filter-toggle">
            <button class="active" onclick="setViewMode('all', this)">All Cases</button>
            <button onclick="setViewMode('mine', this)">My Cases</button>
          </div>
          <button onclick="resetFilters()" class="reset-btn">
            <i class="fas fa-undo"></i> Reset
          </button>
        </div>

        <div id="clientsContainer">
          <div class="loading">
            <i class="fas fa-spinner fa-spin fa-2x"></i>
            <p style="margin-top: 15px;">Loading cases...</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Client Details Modal -->
    <div id="detailsModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2><i class="fas fa-user"></i> Client Details</h2>
          <button class="close-btn" onclick="closeModal('detailsModal')">×</button>
        </div>
        <div class="modal-body" id="detailsContent"></div>
        <div class="modal-actions">
          <button class="btn-cancel" onclick="closeModal('detailsModal')">Close</button>
        </div>
      </div>
    </div>

    <!-- Update Case Modal -->
    <div id="updateModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2><i class="fas fa-edit"></i> Update Case</h2>
          <button class="close-btn" onclick="closeModal('updateModal')">×</button>
        </div>
        <div class="modal-body">
          <div class="form-group-modal">
            <label>Case Status</label>
            <select id="updateStatus">
              <option value="Pending">Pending</option>
              <option value="Assigned">Assigned</option>
              <option value="In Progress">In Progress</option>
              <option value="Completed">Completed</option>
            </select>
          </div>
          <div class="form-group-modal">
            <label>Priority Level</label>
            <select id="updatePriority">
              <option value="Low">Low</option>
              <option value="Medium">Medium</option>
              <option value="High">High</option>
            </select>
          </div>
          <div class="form-group-modal">
            <label>Court / Hearing Date</label>
            <input type="date" id="updateCourtDate" />
          </div>
          <div class="form-group-modal">
            <label>Filing Deadline</label>
            <input type="date" id="updateDeadline" />
          </div>
          <div class="form-group-modal">
            <label class="checkbox-wrap">
              <input type="checkbox" id="assignToMe" />
              <span>Assign this case to me</span>
            </label>
          </div>
          <div class="form-group-modal">
            <label>Add Case Notes</label>
            <textarea
              id="updateNotes"
              placeholder="Enter detailed case notes, updates, or observations..."
            ></textarea>
          </div>
        </div>
        <div class="modal-actions">
          <button class="btn-save" onclick="saveUpdate()" id="saveUpdateBtn">
            <i class="fas fa-save" style="margin-right: 6px;"></i> Save Changes
          </button>
          <button class="btn-cancel" onclick="closeModal("updateModal")">Cancel</button>
        </div>
      </div>
    </div>

    <!-- Add Note Quick Modal -->
    <div id="noteModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2><i class="fas fa-sticky-note"></i> Quick Note</h2>
          <button class="close-btn" onclick="closeModal('noteModal')">×</button>
        </div>
        <div class="modal-body">
          <div class="form-group-modal">
            <label>Add a quick note for this case</label>
            <textarea id="quickNoteText" placeholder="Type your note here..." rows="4"></textarea>
          </div>
        </div>
        <div class="modal-actions">
          <button class="btn-save" onclick="saveQuickNote()">Add Note</button>
          <button class="btn-cancel" onclick="closeModal('noteModal')">Cancel</button>
        </div>
      </div>
    </div>

    <!-- Keep your JavaScript code here (no changes) -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script>
      // Your original JavaScript code remains unchanged
      // (Paste your current script here or keep it as is)
    </script>
  </body>
</html>
